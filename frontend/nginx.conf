server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32m;
    resolver 127.0.11 valid=10s ipv6=off;
    set $ccd_backend http://backend:8000;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com 'unsafe-inline'; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    location /api/ {
        proxy_pass $ccd_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
    location = /health { proxy_pass $ccd_backend/health; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
    location = /ready { proxy_pass $ccd_backend/ready; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable" always; }
    location /mediapipe/ { try_files $uri =404; expires 30d; add_header Cache-Control "public" always; }
    location = /robots.txt { try_files $uri =404; add_header Content-Type "text/plain" always; add_header Cache-Control "public, max-age=86400" always; }
    location = /sitemap.xml { try_files $uri =404; add_header Content-Type "application/xml" always; add_header Cache-Control "public, max-age=86400" always; }
    location = /site.webmanifest { try_files $uri =404; add_header Content-Type "application/manifest+json" always; }
    location /.well-known/ { try_files $uri =404; add_header Cache-Control "public, max-age=86400" always; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store" always; }
    gzip on; gzip_vary on; gzip_min_length 1024; gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
}
