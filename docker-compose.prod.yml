name: fikaai-production

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - fikaai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [private]

  backend:
    build:
      context: ./backend
      target: production
    env_file: ${ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODELS_DIR: /app/models_data
    volumes:
      - fikaai_models:/app/models_data
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python scripts/download_models.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY:-1}"
    restart: unless-stopped
    networks: [private]

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        APP_ROLE: student
        VITE_INSTRUCTOR_APP_URL: https://${INSTRUCTOR_DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]

  frontend-admin:
    build:
      context: ./frontend
      target: production
      args:
        APP_ROLE: admin
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]

  frontend-instructor:
    build:
      context: ./frontend
      target: production
      args:
        APP_ROLE: instructor
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      INSTRUCTOR_DOMAIN: ${INSTRUCTOR_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      frontend-admin:
        condition: service_healthy
      frontend-instructor:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  fikaai_pgdata:
  fikaai_models:
  caddy_data:
  caddy_config:
