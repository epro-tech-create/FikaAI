services:
  db:
    image: postgres:16-alpine
    container_name: fikaai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fikaai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fikaai_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fikaai_db}
    ports:
      - "5432:5432"
    volumes:
      - fikaai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fikaai} -d ${POSTGRES_DB:-fikaai_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: fikaai-backend
    env_file: .env
    environment:
      # Inside the compose network the database host is `db`
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fikaai}:${POSTGRES_PASSWORD:-fikaai_dev}@db:5432/${POSTGRES_DB:-fikaai_db}
    ports:
      - "8000:8000"
    volumes:
      # Model weights persist across rebuilds (~330 MB download on first start)
      - fikaai_models:/app/models_data
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python scripts/download_models.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend-student:
    build:
      context: ./frontend
      target: development
    container_name: fikaai-frontend-student
    command: npm run dev -- --mode student --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  frontend-admin:
    build:
      context: ./frontend
      target: development
    container_name: fikaai-frontend-admin
    command: npm run dev -- --mode admin --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5174:5174"
    depends_on:
      - backend

  frontend-instructor:
    build:
      context: ./frontend
      target: development
    container_name: fikaai-frontend-instructor
    command: npm run dev -- --mode instructor --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5175:5175"
    depends_on:
      - backend

volumes:
  fikaai_pgdata:
  fikaai_models:
